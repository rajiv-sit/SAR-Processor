name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Install Conan
        run: python -m pip install --upgrade pip conan
      - name: Configure
        run: |
          conan profile detect --force
          conan install . --build=missing -s build_type=Release -s compiler.cppstd=23 --output-folder=build
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -D CMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -D CMAKE_POLICY_DEFAULT_CMP0091=NEW
          else
            cmake -S . -B build -G Ninja -D CMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -D CMAKE_POLICY_DEFAULT_CMP0091=NEW -D CMAKE_BUILD_TYPE=Release
          fi
        shell: bash
      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Release
          else
            cmake --build build
          fi
        shell: bash
      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
        shell: bash
