name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Conan
        run: python -m pip install --upgrade pip conan
      - name: Configure
        run: |
          conan profile detect --force
          if [ "$RUNNER_OS" = "Windows" ]; then
            conan install . --build=missing --output-folder=build \
              -pr:h=conan/profiles/msvc194-host-release \
              -pr:b=conan/profiles/msvc194-build-release -o:h '&:with_viewers=False'
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -D CMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -D CMAKE_POLICY_DEFAULT_CMP0091=NEW -D BUILD_TESTING=ON -D SAR_BUILD_VIEWERS=OFF
          else
            conan install . --build=missing -s build_type=Release -s compiler.cppstd=23 --output-folder=build -o:h '&:with_viewers=False'
            cmake -S . -B build -G Ninja -D CMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -D CMAKE_POLICY_DEFAULT_CMP0091=NEW -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTING=ON -D SAR_BUILD_VIEWERS=OFF
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  scientific-processing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install processing and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Lint, format, and type checks
        run: |
          python -m ruff check sar_processing tests/python conanfile.py
          python -m ruff format --check sar_processing tests/python conanfile.py
          python -m mypy sar_processing
      - name: Portable numerical and raster integration tests
        run: python -m pytest --cov=sar_processing --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - name: Enforce separate line and branch coverage thresholds
        shell: python
        run: |
          import json
          with open('coverage.json', encoding='utf-8') as source:
              report = json.load(source)
          for name, item in report['files'].items():
              stats = item['summary']
              assert stats['covered_lines'] >= .9 * stats['num_statements'], name
              assert stats['covered_branches'] >= .9 * stats['num_branches'], name
