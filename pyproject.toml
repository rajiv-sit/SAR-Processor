[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-processor"
version = "0.1.0"
description = "Stage-aware coherent SAR processing and geographic image export"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "pillow>=11,<13", "rasterio>=1.4.4,<2", "affine>=2.4,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
sar-process = "sar_processing.cli:main"
sar-viewer-export = "sar_processing.viewer:main"

[tool.setuptools.packages.find]
include = ["sar_processing*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["measured: integration checks using separately downloaded data"]

[tool.coverage.run]
branch = true
source = ["sar_processing"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["sar_processing"]
